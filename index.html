<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IIDE</title>
<meta name="description" content="IIDE — información que te conecta. Notificaciones institucionales para secretaría, director, administrador, docentes y estudiantes.">
<meta name="theme-color" content="#0F6B66">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#F5F4EF;
    --surface:#FFFFFF;
    --surface-sunken:#EFEEE7;
    --border:#8B8570;
    --ink-900:#161B26;
    --ink-700:#3D4457;
    --ink-500:#636980;
    --ink-on-accent:#FBFAF6;
    --accent:#0F6B66;
    --accent-strong:#0B4F4B;
    --accent-soft:#DCEAE8;
    --btn-bg:#0F6B66;
    --btn-bg-hover:#0B4F4B;
    --urgent:#A54C19;
    --urgent-soft:#F6E2D2;
    --ok:#296F46;
    --ok-soft:#DCEEE1;
    --shadow: 0 1px 2px rgba(22,27,38,0.06), 0 8px 24px -12px rgba(22,27,38,0.18);
    --focus-ring: 0 0 0 3px rgba(15,107,102,0.35);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#11151C;
      --surface:#181D27;
      --surface-sunken:#1F2530;
      --border:#6B7590;
      --ink-900:#EEF0F4;
      --ink-700:#B7BCC9;
      --ink-500:#848CA0;
      --ink-on-accent:#F4FBFA;
      --accent:#2FA69E;
      --accent-strong:#8FD9D2;
      --accent-soft:#1C3634;
      --btn-bg:#1C6D67;
      --btn-bg-hover:#165550;
      --urgent:#E08A4D;
      --urgent-soft:#3B2A1C;
      --ok:#63C186;
      --ok-soft:#1E3628;
      --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 10px 28px -14px rgba(0,0,0,0.6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#11151C;
    --surface:#181D27;
    --surface-sunken:#1F2530;
    --border:#6B7590;
    --ink-900:#EEF0F4;
    --ink-700:#B7BCC9;
    --ink-500:#848CA0;
    --ink-on-accent:#F4FBFA;
    --accent:#2FA69E;
    --accent-strong:#8FD9D2;
    --accent-soft:#1C3634;
    --btn-bg:#1C6D67;
    --btn-bg-hover:#165550;
    --urgent:#E08A4D;
    --urgent-soft:#3B2A1C;
    --ok:#63C186;
    --ok-soft:#1E3628;
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 10px 28px -14px rgba(0,0,0,0.6);
    color-scheme: dark;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg);
    color:var(--ink-900);
    font-family:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{ font-family:"Fraunces", Georgia, serif; text-wrap:balance; margin:0; }
  .mono{ font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums; }
  button{ font-family:inherit; }
  ::selection{ background:var(--accent-soft); }
  :focus-visible{ outline:none; box-shadow:var(--focus-ring); border-radius:8px; }
  [hidden]{ display:none !important; }
  @media (prefers-reduced-motion:no-preference){
    .card, .btn, .chip, .toast, .auth-card{ transition: background 160ms ease, border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease, opacity 160ms ease; }
  }

  .shell{
    display:grid;
    grid-template-columns: 272px 1fr;
    min-height:100vh;
  }
  @media (max-width: 860px){
    .shell{ grid-template-columns: 1fr; }
    .rail{ position:static; height:auto; border-right:none; border-bottom:1px solid var(--border); }
  }

  /* ---------- Sidebar ---------- */
  .rail{
    background:var(--surface);
    border-right:1px solid var(--border);
    padding:22px 18px 18px;
    display:flex;
    flex-direction:column;
    gap:22px;
    position:sticky;
    top:0;
    height:100vh;
    overflow-y:auto;
  }
  .brand{ display:flex; align-items:center; gap:8px; padding:0 2px; }
  .brand .mark{
    width:30px; height:30px; border-radius:8px;
    object-fit:cover; display:block;
    flex:none;
  }
  .brand h1{ font-size:21px; font-weight:600; color:var(--ink-900); }
  .brand .tagline{ font-size:11.5px; color:var(--ink-500); margin-top:2px; letter-spacing:.01em; }

  .rail-section-label{
    font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
    color:var(--ink-500); padding:0 4px;
  }

  .session-card{
    display:flex; align-items:center; gap:10px;
    padding:12px; border:1px solid var(--border); border-radius:12px;
    background:var(--surface-sunken);
  }
  .session-card .avatar{
    width:36px; height:36px; border-radius:50%; flex:none;
    background:var(--btn-bg); color:var(--ink-on-accent);
    display:flex; align-items:center; justify-content:center;
    font-size:14px; font-weight:700;
  }
  .session-card .who{ min-width:0; }
  .session-card .name{ font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .session-card .role{ font-size:11.5px; color:var(--ink-500); }

  .rail-footer{ margin-top:auto; display:flex; flex-direction:column; gap:8px; }
  .reset-btn{
    display:flex; align-items:center; gap:8px; justify-content:center;
    padding:8px 10px; border-radius:9px; border:1px solid var(--border);
    background:none; color:var(--ink-500); font-size:12.5px; cursor:pointer;
  }
  .reset-btn:hover{ color:var(--ink-900); border-color:var(--ink-500); }

  /* ---------- Main ---------- */
  main{ padding:28px 32px 60px; max-width:840px; }
  @media (max-width: 600px){ main{ padding:20px 16px 48px; } }

  .topbar{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap; }
  .topbar h2{ font-size:26px; font-weight:600; }
  .topbar .sub{ color:var(--ink-500); font-size:13.5px; margin-top:4px; }

  .tabs{ display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:22px; }
  .tab{
    padding:9px 4px; margin-right:18px; background:none; border:none; cursor:pointer;
    font-size:13.5px; font-weight:500; color:var(--ink-500);
    border-bottom:2px solid transparent; margin-bottom:-1px;
  }
  .tab[aria-selected="true"]{ color:var(--ink-900); border-bottom-color:var(--accent); }
  .tab:hover{ color:var(--ink-900); }

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:18px 20px; box-shadow:var(--shadow);
  }
  .stack{ display:flex; flex-direction:column; gap:14px; }

  /* Forms (compose + auth share these) */
  .field{ display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
  .field label{ font-size:12.5px; font-weight:600; color:var(--ink-700); }
  .field .hint{ font-size:11.5px; color:var(--ink-500); }
  input[type="text"], input[type="password"], textarea, select{
    font: inherit; font-size:14px;
    background:var(--surface-sunken); color:var(--ink-900);
    border:1px solid var(--border); border-radius:9px;
    padding:9px 11px; width:100%;
  }
  textarea{ resize:vertical; min-height:84px; }
  .radio-row{ display:flex; flex-direction:column; gap:8px; }
  .radio-opt{ display:flex; align-items:center; gap:9px; padding:9px 10px; border:1px solid var(--border); border-radius:9px; cursor:pointer; }
  .radio-opt input{ accent-color:var(--accent); }
  .radio-opt .extra{ margin-left:auto; min-width:180px; }
  .priority-row{ display:flex; gap:8px; }
  .priority-opt{ flex:1; text-align:center; padding:9px; border:1px solid var(--border); border-radius:9px; cursor:pointer; font-size:13px; font-weight:500; color:var(--ink-700); }
  .priority-opt input{ display:none; }
  .priority-opt:has(input:checked){ border-color:var(--accent); background:var(--accent-soft); color:var(--ink-900); }
  .priority-opt.urgente:has(input:checked){ border-color:var(--urgent); background:var(--urgent-soft); color:var(--urgent); }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:10px 18px; border-radius:9px; border:1px solid transparent;
    font-size:13.5px; font-weight:600; cursor:pointer; width:100%;
  }
  .btn-primary{ background:var(--btn-bg); color:var(--ink-on-accent); }
  .btn-primary:hover{ background:var(--btn-bg-hover); }
  .btn-ghost{ background:none; border-color:var(--border); color:var(--ink-700); }
  .btn-ghost:hover{ border-color:var(--ink-500); color:var(--ink-900); }
  .btn:disabled{ opacity:.55; cursor:default; }

  /* ---------- Auth (login / crear cuenta) ---------- */
  .auth-wrap{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px; background:var(--bg);
  }
  .auth-card{
    width:100%; max-width:408px; background:var(--surface); border:1px solid var(--border);
    border-radius:16px; padding:30px 28px 26px; box-shadow:var(--shadow);
  }
  .auth-brand{ display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .auth-brand .mark{
    width:34px; height:34px; border-radius:9px; flex:none;
    object-fit:cover; display:block;
  }
  .auth-brand h1{ font-size:22px; font-weight:600; }
  .auth-sub{ font-size:12.5px; color:var(--ink-500); margin:2px 0 22px 44px; }
  .auth-tabs{ display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:20px; }
  .auth-tab{
    padding:9px 2px; margin-right:20px; background:none; border:none; cursor:pointer;
    font-size:13.5px; font-weight:600; color:var(--ink-500);
    border-bottom:2px solid transparent; margin-bottom:-1px;
  }
  .auth-tab[aria-selected="true"]{ color:var(--ink-900); border-bottom-color:var(--accent); }
  .auth-error{
    font-size:12.5px; color:var(--urgent); background:var(--urgent-soft);
    border-radius:9px; padding:9px 12px; margin-bottom:16px;
  }
  .auth-row-2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .auth-hint{ font-size:11.5px; color:var(--ink-500); margin-top:18px; line-height:1.55; text-align:center; }
  .auth-hint b{ color:var(--ink-700); font-family:"IBM Plex Mono", monospace; font-weight:500; }
  .auth-reset-link{
    display:block; margin:14px auto 0; background:none; border:none; cursor:pointer;
    font-size:11.5px; color:var(--ink-500); text-decoration:underline; text-underline-offset:2px;
  }
  .auth-reset-link:hover{ color:var(--ink-900); }

  /* Notification card (staff view) */
  .noti-card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px 18px; }
  .noti-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .noti-title{ font-size:15.5px; font-weight:600; }
  .noti-meta{ font-size:12px; color:var(--ink-500); margin-top:3px; }
  .noti-msg{ font-size:13.5px; color:var(--ink-700); margin:10px 0 12px; }
  .adjunto-link{ display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; color:var(--accent-strong); text-decoration:none; padding:5px 11px; border-radius:99px; background:var(--accent-soft); }
  .adjunto-link:hover{ text-decoration:underline; }
  .badge{ display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; padding:3px 9px; border-radius:99px; letter-spacing:.02em; white-space:nowrap; }
  .badge-urgente{ background:var(--urgent-soft); color:var(--urgent); }
  .badge-normal{ background:var(--surface-sunken); color:var(--ink-500); }
  .progress-row{ display:flex; align-items:center; gap:10px; margin-top:4px; }
  .progress-track{ flex:1; height:6px; border-radius:99px; background:var(--surface-sunken); overflow:hidden; }
  .progress-fill{ height:100%; background:var(--ok); border-radius:99px; }
  .progress-label{ font-size:11.5px; color:var(--ink-500); white-space:nowrap; }

  /* Student feed card */
  .feed-card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:17px 19px; }
  .feed-card.urgente{ border-color:color-mix(in srgb, var(--urgent) 45%, var(--border)); }
  .sender-row{ display:flex; align-items:center; gap:9px; margin-bottom:10px; }
  .sender-avatar{
    width:30px; height:30px; border-radius:50%; background:var(--surface-sunken); color:var(--ink-700);
    display:flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:600; flex:none;
  }
  .sender-name{ font-size:13px; font-weight:600; }
  .sender-role{ font-size:11.5px; color:var(--ink-500); }
  .feed-card h3{ font-size:16.5px; font-weight:600; margin-bottom:6px; }
  .feed-msg{ font-size:14px; color:var(--ink-700); margin-bottom:14px; }
  .feed-foot{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .feed-time{ font-size:11.5px; color:var(--ink-500); }
  .ok-btn{
    display:inline-flex; align-items:center; gap:7px; padding:8px 20px; border-radius:99px;
    background:var(--btn-bg); color:var(--ink-on-accent); border:none; font-weight:700; font-size:13px;
    cursor:pointer; letter-spacing:.02em;
  }
  .ok-btn:hover{ background:var(--btn-bg-hover); }
  .confirmed-pill{
    display:inline-flex; align-items:center; gap:6px; padding:7px 14px; border-radius:99px;
    background:var(--ok-soft); color:var(--ok); font-weight:600; font-size:12.5px;
  }

  .empty{ text-align:center; padding:48px 20px; color:var(--ink-500); }
  .empty h3{ font-size:16px; color:var(--ink-900); margin-bottom:6px; }
  .empty p{ font-size:13px; max-width:340px; margin:0 auto; }

  .callout{
    display:flex; gap:10px; align-items:flex-start;
    background:var(--surface-sunken); border:1px solid var(--border); border-radius:12px;
    padding:12px 14px; font-size:12.5px; color:var(--ink-700); margin-bottom:20px;
  }
  .callout .dot{ width:6px; height:6px; border-radius:50%; background:var(--accent); margin-top:6px; flex:none; }

  .audit-row{ display:flex; align-items:center; gap:10px; padding:11px 4px; border-bottom:1px solid var(--border); font-size:13px; }
  .audit-row:last-child{ border-bottom:none; }
  .audit-emisor{ width:150px; flex:none; color:var(--ink-500); font-size:12px; }
  .audit-title{ flex:1; font-weight:500; }
  .audit-stats{ font-size:11.5px; color:var(--ink-500); flex:none; }

  .toast-wrap{ position:fixed; bottom:22px; left:50%; transform:translateX(-50%); z-index:40; display:flex; flex-direction:column; gap:8px; align-items:center; }
  .toast{
    background:var(--ink-900); color:var(--bg); font-size:13px; font-weight:500;
    padding:10px 18px; border-radius:99px; box-shadow:var(--shadow);
    display:flex; align-items:center; gap:8px;
  }
</style>
</head>

  async function sha256Hex(text){
    var data = new TextEncoder().encode(text);
    var digest = await crypto.subtle.digest("SHA-256", data);
    return Array.prototype.map.call(new Uint8Array(digest), function(b){ return b.toString(16).padStart(2, "0"); }).join("");
  }

  async function ensureAccounts(){
    try{
      var raw = localStorage.getItem(ACCOUNTS_KEY);
      if (raw){
        var parsed = JSON.parse(raw);
        if (Array.isArray(parsed) && parsed.length) return parsed;
      }
    }catch(e){ /* fall through to reseed */ }

    var hash = await sha256Hex(DEMO_PASSWORD);
    var accounts = SEED_ACCOUNTS.map(function(a){
      var copy = {};
      Object.keys(a).forEach(function(k){ copy[k] = a[k]; });
      copy.passwordHash = hash;
      return copy;
    });
    persistAccounts(accounts);
    return accounts;
  }
  function persistAccounts(accounts){
    try{ localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(accounts)); }catch(e){ /* private mode / quota: state stays in memory only */ }
  }

  function loadNotifState(accounts){
    try{
      var raw = localStorage.getItem(STATE_KEY);
      if (raw){
        var parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.notifications)){
          if (!Array.isArray(parsed.reportes)) parsed.reportes = [];
          return parsed;
        }
      }
    }catch(e){ /* fall through to reseed */ }
    return seedNotifications(accounts);
  }

  function toast(msg){

    wrap.appendChild(el);

    setTimeout(function(){ if (el.parentNode) wrap.removeChild(el); }, 2300);
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }
  function initialsFrom(nombre){
    var parts = nombre.trim().split(/\s+/);
    var s = (parts[0] ? parts[0][0] : "") + (parts[1] ? parts[1][0] : "");
    return s.toUpperCase() || "?";
  }

  function renderAuthScreen(){

    var body = document.getElementById("auth-body");

    else if (authTab === "register") body.innerHTML = registerFormHtml();
    else body.innerHTML = recoverFormHtml();

    var errBox = "";
    if (authError) errBox = '<div class="auth-error">' + escapeHtml(authError) + '</div>';
    body.insertAdjacentHTML("afterbegin", errBox);

    if (authTab === "login") wireLoginForm();
    else if (authTab === "register") wireRegisterForm();
    else wireRecoverForm();

  function wireLoginForm(){
    var form = document.getElementById("login-form");
    form.addEventListener("submit", async function(ev){
      ev.preventDefault();
      var usuario = document.getElementById("li-usuario").value.trim().toLowerCase();
      var password = document.getElementById("li-password").value;
      authDraft = { usuario: usuario };
      var acc = accounts.filter(function(a){ return a.usuario === usuario; })[0];
      if (!acc){ authError = "No existe ninguna cuenta con ese usuario."; renderAuthScreen(); return; }
      var hash = await sha256Hex(password);
      if (hash !== acc.passwordHash){ authError = "La contraseña no es correcta."; renderAuthScreen(); return; }
      authError = "";
      authDraft = {};
      session = { accountId: acc.id };
      persistSession();
      renderAll();
      toast("Hola, " + acc.nombre.split(" ")[0]);
    });
    document.getElementById("goto-recover").addEventListener("click", function(){
      authTab = "recover"; authError = ""; recoverStep = "find"; recoverMatches = []; recoverMatch = null;
      renderAuthScreen();
    });
  }

  function wireRecoverForm(){
    document.getElementById("recover-back").addEventListener("click", function(){
      authTab = "login"; authError = ""; recoverStep = "find"; recoverMatches = []; recoverMatch = null;
      renderAuthScreen();
    });

    if (recoverStep === "find"){
      document.getElementById("recover-find-form").addEventListener("submit", function(ev){
        ev.preventDefault();
        var q = document.getElementById("rc-query").value.trim().toLowerCase();
        if (!q){ authError = "Escribí tu usuario o tu nombre completo."; renderAuthScreen(); return; }
        var porUsuario = accounts.filter(function(a){ return a.usuario === q; });
        var matches = porUsuario.length ? porUsuario : accounts.filter(function(a){ return a.nombre.toLowerCase().indexOf(q) !== -1; });
        if (!matches.length){ authError = "No encontramos ninguna cuenta con ese usuario o nombre."; renderAuthScreen(); return; }
        authError = "";
        if (matches.length === 1){ recoverMatch = matches[0]; recoverStep = "reset"; }
        else { recoverMatches = matches; recoverStep = "choose"; }
        renderAuthScreen();
      });
    } else if (recoverStep === "choose"){
      document.querySelectorAll(".recover-candidate").forEach(function(btn){
        btn.addEventListener("click", function(){
          var id = btn.getAttribute("data-id");
          recoverMatch = recoverMatches.filter(function(a){ return a.id === id; })[0];
          recoverStep = "reset";
          renderAuthScreen();
        });
      });
    } else if (recoverStep === "reset"){
      document.getElementById("recover-reset-form").addEventListener("submit", async function(ev){
        ev.preventDefault();
        var p1 = document.getElementById("rc-password").value;
        var p2 = document.getElementById("rc-password2").value;
        if (p1.length < 6){ authError = "La contraseña necesita al menos 6 caracteres."; renderAuthScreen(); return; }
        if (p1 !== p2){ authError = "Las dos contraseñas no coinciden."; renderAuthScreen(); return; }
        var acc = accounts.filter(function(a){ return a.id === recoverMatch.id; })[0];
        acc.passwordHash = await sha256Hex(p1);
        persistAccounts(accounts);
        authError = "";
        var nombre = acc.nombre;
        recoverStep = "find"; recoverMatches = []; recoverMatch = null;
        session = { accountId: acc.id };
        persistSession();
        renderAll();
        toast("Contraseña actualizada — hola de nuevo, " + nombre.split(" ")[0]);
      });
    }
  }

  function wireRegisterForm(){
    var rolSelect = document.getElementById("re-rol");
    function syncConditional(){
      var rol = rolSelect.value;
      document.getElementById("re-cohorte-wrap").hidden = rol !== "estudiante";
      document.getElementById("re-detalle-wrap").hidden = rol !== "docente";
    }
    rolSelect.addEventListener("change", syncConditional);
    syncConditional();

    var form = document.getElementById("register-form");
    form.addEventListener("submit", async function(ev){
      ev.preventDefault();
      var nombre = document.getElementById("re-nombre").value.trim();
      var usuario = document.getElementById("re-usuario").value.trim().toLowerCase();
      var password = document.getElementById("re-password").value;
      var rol = rolSelect.value;
      var cohorteField = document.getElementById("re-cohorte").value;
      var detalleField = document.getElementById("re-detalle").value.trim();
      authDraft = { nombre:nombre, usuario:usuario, rol:rol, cohorte:cohorteField, detalle:detalleField };

      if (!nombre || !usuario){ authError = "Completá tu nombre y un usuario."; renderAuthScreen(); return; }
      if (!/^[a-z0-9._-]{3,24}$/.test(usuario)){ authError = "El usuario debe tener entre 3 y 24 caracteres: letras, números, punto o guión."; renderAuthScreen(); return; }
      if (password.length < 6){ authError = "La contraseña necesita al menos 6 caracteres."; renderAuthScreen(); return; }
      if (accounts.some(function(a){ return a.usuario === usuario; })){ authError = "Ese usuario ya existe — probá con otro."; renderAuthScreen(); return; }

      var roleLabel = ROLE_LABELS[rol];
      var cohorte;
      if (rol === "estudiante"){
        cohorte = cohorteField;
      } else if (rol === "docente" && detalleField){
        roleLabel = "Docente · " + detalleField;
      }

      var hash = await sha256Hex(password);
      var acc = {
        id: "acc-" + Date.now(),
        nombre: nombre, usuario: usuario, rol: rol, roleLabel: roleLabel,
        initials: initialsFrom(nombre), passwordHash: hash
      };
      if (cohorte) acc.cohorte = cohorte;

      accounts.push(acc);
      persistAccounts(accounts);
      authError = "";
      authDraft = {};
      session = { accountId: acc.id };
      persistSession();
      renderAll();
      toast("Cuenta creada — bienvenido/a, " + nombre.split(" ")[0]);
    });
  }

    // El docente ya no le envía avisos directo al estudiante: solo le avisa a

    var tabs = [];
    if (isDocente){
      tabs.push(["reportar", "Avisar a secretaría/director"]);
      tabs.push(["notis", "Notificaciones recibidas"]);
      tabs.push(["enviadas", "Enviadas por mí"]);

      tabs.push(["enviadas", "Enviadas por mí"]);
      if (isDireccion) tabs.push(["historial", "Historial institucional"]);
    }
    if (recibeReportes) tabs.push(["recibidos", "Avisos de docentes"]);

    var validTabs = tabs.map(function(t){ return t[0]; });
    if (validTabs.indexOf(activeTab) === -1) activeTab = tabs[0][0];

    var tabsHtml = tabs.map(function(t){
      var sel = activeTab === t[0];
      return '<button class="tab" role="tab" aria-selected="' + sel + '" data-tab="' + t[0] + '">' + t[1] + '</button>';
    }).join("");

    var subLine = isDocente ? ' — le avisás a secretaría y al director, y recibís las notificaciones que te envíen'
                : recibeReportes ? ' — emitís avisos para los estudiantes y recibís los reportes de los docentes'
                : ' — emitís avisos para estudiantes, docentes y secretaría';

    var html = '<div class="topbar"><div><h2>Hola, ' + escapeHtml(user.nombre.split(" ")[0]) + '</h2>' +
      '<div class="sub">' + escapeHtml(user.roleLabel) + subLine + '</div></div></div>' +
      '<div class="tabs" role="tablist">' + tabsHtml + '</div>' +
      '<div id="tab-body"></div>';
    document.getElementById("main").innerHTML = html;

    document.querySelectorAll(".tab").forEach(function(btn){
      btn.addEventListener("click", function(){
        activeTab = btn.getAttribute("data-tab");
        renderStaffMain(user);
      });
    });

    var body = document.getElementById("tab-body");
    if (activeTab === "nueva") body.innerHTML = composeFormHtml(user);
    else if (activeTab === "enviadas") body.innerHTML = isDocente ? reportesSentHtml(user.id) : sentListHtml(user.id, false);
    else if (activeTab === "historial") body.innerHTML = sentListHtml(null, true);
    else if (activeTab === "reportar") body.innerHTML = reportFormHtml();
    else if (activeTab === "recibidos") body.innerHTML = receivedReportsHtml(user.rol);
    else if (activeTab === "notis") body.innerHTML = recibidasHtml(user);

    if (activeTab === "nueva") wireComposeForm(user);
    else if (activeTab === "reportar") wireReportForm(user);
    else if (activeTab === "notis") wireRecibidas(user);
  }

  // Bandeja de notificaciones recibidas directamente (no a través de un curso): hoy la usan
  // el docente (RF-16) y secretaría — cualquier rol que pueda ser destinatario individual
  // de una notificación de otro emisor, además de emitir las suyas.
  function recibidasHtml(user){
    var mine = notifState.notifications.filter(function(n){ return n.destinatarios.indexOf(user.id) !== -1; });
    mine.sort(function(a,b){
      var aUn = !isConfirmedBy(a.id, user.id), bUn = !isConfirmedBy(b.id, user.id);
      if (aUn !== bUn) return aUn ? -1 : 1;
      return new Date(b.fecha) - new Date(a.fecha);
    });
    if (!mine.length){
      return '<div class="card empty"><h3>No tenés notificaciones por ahora</h3><p>Cuando alguien te envíe una notificación a vos directamente (no a un curso), va a aparecer acá.</p></div>';
    }
    return '<div class="stack">' + mine.map(function(n){ return feedCard(n, user.id); }).join("") + '</div>';
  }

  function wireRecibidas(user){
    document.querySelectorAll(".ok-btn").forEach(function(btn){
      btn.addEventListener("click", function(){
        var nid = btn.getAttribute("data-nid");
        notifState.confirmations.push({ notifId: nid, destinatarioId: user.id, fecha: new Date().toISOString() });
        persistNotifState();
        renderStaffMain(user);
        toast("Confirmado");
      });
    });
  }

  function composeFormHtml(user){
    var cohorteOptions = cohorteOptionsHtml(null);
    var studentOptions = allStudents(accounts)
      .map(function(u){ return '<option value="' + u.id + '">' + escapeHtml(u.nombre) + ' — ' + COHORTES[u.cohorte] + '</option>'; }).join("");
    var docenteOptions = allDocentes(accounts)
      .map(function(u){ return '<option value="' + u.id + '">' + escapeHtml(u.nombre) + (u.roleLabel ? ' — ' + escapeHtml(u.roleLabel.replace(/^Docente( · )?/, "")) : "") + '</option>'; }).join("");
    var docenteOpt = docenteOptions
      ? '<label class="radio-opt"><input type="radio" name="f-dest" value="docente">Un docente' +
        '<select class="extra" id="f-docente">' + docenteOptions + '</select></label>'
      : "";

    var secretariaOptions = allSecretarias(accounts)
      .filter(function(u){ return !user || u.id !== user.id; })
      .map(function(u){ return '<option value="' + u.id + '">' + escapeHtml(u.nombre) + '</option>'; }).join("");
    var secretariaOpt = secretariaOptions
      ? '<label class="radio-opt"><input type="radio" name="f-dest" value="secretaria">Secretaría' +
        '<select class="extra" id="f-secretaria">' + secretariaOptions + '</select></label>'
      : "";

    return '<form class="card stack" id="compose-form">' +
      '<div class="field"><label for="f-titulo">Título</label>' +
      '<input type="text" id="f-titulo" maxlength="90" placeholder="Ej: Cambio de aula para el examen final" required></div>' +

      '<div class="field"><label for="f-mensaje">Mensaje</label>' +
      '<textarea id="f-mensaje" maxlength="600" placeholder="Escribí el aviso completo. Los estudiantes lo van a ver tal cual, sin poder responder." required></textarea></div>' +

      '<div class="field"><label>Prioridad</label>' +
      '<div class="priority-row">' +
      '<label class="priority-opt"><input type="radio" name="f-prioridad" value="normal" checked>Normal</label>' +
      '<label class="priority-opt urgente"><input type="radio" name="f-prioridad" value="urgente">Urgente</label>' +
      '</div></div>' +

      '<div class="field"><label>Destinatarios</label>' +
      '<div class="radio-row">' +
      '<label class="radio-opt"><input type="radio" name="f-dest" value="institucion" checked>Toda la institución</label>' +
      '<label class="radio-opt"><input type="radio" name="f-dest" value="cohorte">Un curso' +
      '<select class="extra" id="f-cohorte">' + cohorteOptions + '</select></label>' +
      '<label class="radio-opt"><input type="radio" name="f-dest" value="individual">Un estudiante' +
      '<select class="extra" id="f-estudiante">' + studentOptions + '</select></label>' +
      docenteOpt +
      secretariaOpt +
      '</div></div>' +

      '<div><button type="submit" class="btn btn-primary" style="width:auto;">Enviar notificación</button></div>' +
      '</form>';
  }

  function wireComposeForm(user){
    var form = document.getElementById("compose-form");
    form.addEventListener("submit", function(ev){
      ev.preventDefault();
      var titulo = document.getElementById("f-titulo").value.trim();
      var mensaje = document.getElementById("f-mensaje").value.trim();
      if (!titulo || !mensaje) return;
      var prioridad = form.querySelector('input[name="f-prioridad"]:checked').value;
      var destTipo = form.querySelector('input[name="f-dest"]:checked').value;
      var destValor = destTipo === "cohorte" ? document.getElementById("f-cohorte").value
                     : destTipo === "individual" ? document.getElementById("f-estudiante").value
                     : destTipo === "docente" ? document.getElementById("f-docente").value
                     : destTipo === "secretaria" ? document.getElementById("f-secretaria").value
                     : null;

      var n = {
        id: "n" + Date.now(),
        emisorId: user.id,
        titulo: titulo, mensaje: mensaje, prioridad: prioridad,
        destTipo: destTipo, destValor: destValor,
        fecha: new Date().toISOString()
      };
      n.destinatarios = (destTipo === "docente" || destTipo === "secretaria") ? (destValor ? [destValor] : []) : studentsIn(accounts, destTipo, destValor);
      notifState.notifications.unshift(n);
      persistNotifState();
      activeTab = "enviadas";
      renderStaffMain(user);
      var destLabel = destTipo === "docente" ? "docente" : destTipo === "secretaria" ? "persona de secretaría" : "estudiante";
      toast("Notificación enviada a " + n.destinatarios.length + " " + destLabel + (n.destinatarios.length===1?"":"s"));
    });
  }

  function sentListHtml(emisorId, isAudit){
    var list = notifState.notifications.filter(function(n){ return isAudit || n.emisorId === emisorId; });
    if (!list.length){
      return '<div class="card empty"><h3>Todavía no enviaste nada</h3><p>Cuando envíes una notificación, vas a poder ver acá cuántos estudiantes la confirmaron.</p></div>';
    }
    if (isAudit){
      return '<div class="card" style="padding:6px 20px;">' + list.map(auditRow).join("") + '</div>';
    }
    return '<div class="stack">' + list.map(sentCard).join("") + '</div>';
  }

  function sentCard(n){
    var confs = confirmationsFor(n.id);
    var total = n.destinatarios.length;
    var pct = total ? Math.round(100 * confs.length / total) : 0;
    return '<div class="noti-card">' +
      '<div class="noti-head"><div>' +
      '<div class="noti-title">' + escapeHtml(n.titulo) + '</div>' +
      '<div class="noti-meta">' + destinatarioLabel(n) + ' · ' + fmtDateTime(n.fecha) + '</div>' +
      '</div>' + priorityBadge(n.prioridad) + '</div>' +
      '<div class="noti-msg">' + escapeHtml(n.mensaje) + '</div>' +
      '<div class="progress-row"><div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
      '<span class="progress-label mono">' + confs.length + '/' + total + ' confirmaron</span></div>' +
      '</div>';
  }

  function auditRow(n){
    var emisor = byId(n.emisorId);
    var confs = confirmationsFor(n.id);
    return '<div class="audit-row">' +
      '<span class="audit-emisor">' + escapeHtml(emisor ? emisor.roleLabel.split(" · ")[0] : "") + '</span>' +
      '<span class="audit-title">' + escapeHtml(n.titulo) + '<br><span style="color:var(--ink-500); font-size:11.5px;">' + destinatarioLabel(n) + ' · ' + fmtDateTime(n.fecha) + '</span></span>' +
      '<span class="audit-stats mono">' + confs.length + '/' + n.destinatarios.length + '</span>' +
      '</div>';
  }

  function priorityBadge(p){
    return p === "urgente" ? '<span class="badge badge-urgente">● Urgente</span>' : '<span class="badge badge-normal">Normal</span>';
  }

  /* ---------------- Docente → Secretaría/Director: reportar situación ---------------- */
  function reportFormHtml(){
    return '<form class="card stack" id="report-form">' +
      '<div class="field"><label for="r-titulo">Título</label>' +
      '<input type="text" id="r-titulo" maxlength="90" placeholder="Ej: Ausencias reiteradas en el curso" required></div>' +

      '<div class="field"><label for="r-mensaje">Mensaje</label>' +
      '<textarea id="r-mensaje" maxlength="600" placeholder="Describí lo que quieras avisarle a secretaría y/o al director." required></textarea>' +
      '<span class="hint">Este reporte es un aviso interno entre personal: los estudiantes no lo ven.</span></div>' +

      '<div class="field"><label for="r-archivo">Adjuntar archivo (opcional)</label>' +
      '<input type="file" id="r-archivo" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.txt">' +
      '<span class="hint" id="r-archivo-error" style="display:none; color:var(--danger, #b3432b);">El archivo no puede pesar más de 3 MB.</span></div>' +

      '<div class="field"><label>Prioridad</label>' +
      '<div class="priority-row">' +
      '<label class="priority-opt"><input type="radio" name="r-prioridad" value="normal" checked>Normal</label>' +
      '<label class="priority-opt urgente"><input type="radio" name="r-prioridad" value="urgente">Urgente</label>' +
      '</div></div>' +

      '<div class="field"><label>Enviar a — podés elegir una opción o las dos al mismo tiempo</label>' +
      '<div class="radio-row">' +
      '<label class="radio-opt"><input type="checkbox" name="r-rol" value="secretaria" checked>Secretaría</label>' +
      '<label class="radio-opt"><input type="checkbox" name="r-rol" value="direccion" checked>Director</label>' +
      '</div><span class="hint" id="r-rol-error" style="display:none; color:var(--danger, #b3432b);">Elegí al menos un destinatario.</span></div>' +

      '<div><button type="submit" class="btn btn-primary" style="width:auto;">Enviar reporte</button></div>' +
      '</form>';
  }

  var ADJUNTO_MAX_BYTES = 3 * 1024 * 1024;

  function wireReportForm(user){
    var form = document.getElementById("report-form");
    form.addEventListener("submit", function(ev){
      ev.preventDefault();
      var titulo = document.getElementById("r-titulo").value.trim();
      var mensaje = document.getElementById("r-mensaje").value.trim();
      var roles = Array.prototype.slice.call(form.querySelectorAll('input[name="r-rol"]:checked')).map(function(cb){ return cb.value; });
      var errEl = document.getElementById("r-rol-error");
      if (!roles.length){ if (errEl) errEl.style.display = "block"; return; }
      if (errEl) errEl.style.display = "none";
      if (!titulo || !mensaje) return;
      var prioridad = form.querySelector('input[name="r-prioridad"]:checked').value;

      var archivoInput = document.getElementById("r-archivo");
      var archivoErrEl = document.getElementById("r-archivo-error");
      var file = archivoInput && archivoInput.files && archivoInput.files[0];
      if (archivoErrEl) archivoErrEl.style.display = "none";

      function finishSubmit(adjunto){
        var r = {
          id: "r" + Date.now(),
          docenteId: user.id,
          titulo: titulo, mensaje: mensaje, prioridad: prioridad,
          rolesDestino: roles,
          adjunto: adjunto || null,
          fecha: new Date().toISOString()
        };
        notifState.reportes.unshift(r);
        persistNotifState();
        activeTab = "enviadas";
        renderStaffMain(user);
        toast("Reporte enviado a " + rolesDestinoLabel(roles));
      }

      if (!file){
        finishSubmit(null);
        return;
      }
      if (file.size > ADJUNTO_MAX_BYTES){
        if (archivoErrEl) archivoErrEl.style.display = "block";
        return;
      }
      var reader = new FileReader();
      reader.onload = function(){
        finishSubmit({ nombre: file.name, tipo: file.type, tamano: file.size, dataUrl: reader.result });
      };
      reader.onerror = function(){
        if (archivoErrEl){ archivoErrEl.textContent = "No se pudo leer el archivo. Probá de nuevo."; archivoErrEl.style.display = "block"; }
      };
      reader.readAsDataURL(file);
    });
  }

  function rolesDestinoLabel(roles){
    return roles.map(function(r){ return ROLE_LABELS[r]; }).join(" y ");
  }

  function reportesSentHtml(docenteId){
    var list = notifState.reportes.filter(function(r){ return r.docenteId === docenteId; });
    if (!list.length){
      return '<div class="card empty"><h3>Todavía no enviaste ningún aviso</h3><p>Cuando le avisés algo importante a secretaría o al director, lo vas a ver acá, con la fecha y a quién se lo mandaste.</p></div>';
    }
    return '<div class="stack">' + list.map(reportCard).join("") + '</div>';
  }

  function receivedReportsHtml(rol){
    var list = notifState.reportes.filter(function(r){ return r.rolesDestino.indexOf(rol) !== -1; });
    list = list.slice().sort(function(a,b){ return new Date(b.fecha) - new Date(a.fecha); });
    if (!list.length){
      return '<div class="card empty"><h3>Todavía no hay avisos de docentes</h3><p>Cuando un docente avise algo importante, va a aparecer acá.</p></div>';
    }
    return '<div class="stack">' + list.map(reportCard).join("") + '</div>';
  }

  function reportCard(r){
    var docente = byId(r.docenteId);
    var adjuntoHtml = r.adjunto
      ? '<a class="adjunto-link" href="' + r.adjunto.dataUrl + '" download="' + escapeHtml(r.adjunto.nombre) + '">📎 ' + escapeHtml(r.adjunto.nombre) + '</a>'
      : "";
    return '<div class="noti-card">' +
      '<div class="noti-head"><div>' +
      '<div class="noti-title">' + escapeHtml(r.titulo) + '</div>' +
      '<div class="noti-meta">' + (docente ? escapeHtml(docente.nombre) : "Docente") +
      ' · para ' + rolesDestinoLabel(r.rolesDestino) + ' · ' + fmtDateTime(r.fecha) + '</div>' +
      '</div>' + priorityBadge(r.prioridad) + '</div>' +
      '<div class="noti-msg">' + escapeHtml(r.mensaje) + '</div>' +
      adjuntoHtml +
      '</div>';
  }

  /* ---------------- Main: student view ---------------- */
  function renderStudentMain(user){
    var mine = notifState.notifications.filter(function(n){ return n.destinatarios.indexOf(user.id) !== -1; });
    mine.sort(function(a,b){
      var aUn = !isConfirmedBy(a.id, user.id), bUn = !isConfirmedBy(b.id, user.id);
      if (aUn !== bUn) return aUn ? -1 : 1;
      return new Date(b.fecha) - new Date(a.fecha);
    });

    var html = '<div class="topbar"><div><h2>Hola, ' + escapeHtml(user.nombre.split(" ")[0]) + '</h2>' +
      '<div class="sub">' + (COHORTES[user.cohorte] || "") + '</div></div></div>' +
      '<div class="callout"><span class="dot"></span><span>Acá recibís los avisos de secretaría, el director y el administrador.</span></div>';

    if (!mine.length){
      html += '<div class="card empty"><h3>No tenés avisos por ahora</h3><p>Cuando alguien te envíe una notificación, va a aparecer acá.</p></div>';
    } else {
      html += '<div class="stack">' + mine.map(function(n){ return feedCard(n, user.id); }).join("") + '</div>';
    }
    document.getElementById("main").innerHTML = html;

    document.querySelectorAll(".ok-btn").forEach(function(btn){
      btn.addEventListener("click", function(){
        var nid = btn.getAttribute("data-nid");
        notifState.confirmations.push({ notifId: nid, destinatarioId: user.id, fecha: new Date().toISOString() });
        persistNotifState();
        renderStudentMain(user);
        toast("Confirmado");
      });
    });
  }

  function feedCard(n, studentId){
    var emisor = byId(n.emisorId);
    var confirmed = isConfirmedBy(n.id, studentId);
    var when = confirmedAt(n.id, studentId);
    return '<div class="feed-card' + (n.prioridad === "urgente" ? " urgente" : "") + '">' +
      '<div class="sender-row"><span class="sender-avatar">' + emisor.initials + '</span>' +
      '<div><div class="sender-name">' + escapeHtml(emisor.nombre) + '</div>' +
      '<div class="sender-role">' + escapeHtml(emisor.roleLabel) + '</div></div>' +
      '<span style="margin-left:auto;">' + priorityBadge(n.prioridad) + '</span></div>' +
      '<h3>' + escapeHtml(n.titulo) + '</h3>' +
      '<div class="feed-msg">' + escapeHtml(n.mensaje) + '</div>' +
      '<div class="feed-foot"><span class="feed-time mono">' + fmtDateTime(n.fecha) + '</span>' +
      (confirmed
        ? '<span class="confirmed-pill">✓ Confirmado · ' + fmtDateTime(when) + '</span>'
        : '<button type="button" class="ok-btn" data-nid="' + n.id + '">OK, lo leí</button>') +
      '</div></div>';
  }

  /* ---------------- Orchestration ---------------- */
  function renderShell(){
    var user = currentUser();
    if (!user){ session = null; persistSession(); renderAll(); return; }
    renderSessionPanel(user);
    if (user.rol === "estudiante") renderStudentMain(user);
    else renderStaffMain(user);
  }

  function renderAll(){
    var authScreen = document.getElementById("auth-screen");
    var shell = document.getElementById("shell");
    if (!session){
      shell.hidden = true;
      authScreen.hidden = false;
      renderAuthScreen();
    } else {
      authScreen.hidden = true;
      shell.hidden = false;
      renderShell();
    }
  }

  function resetDemo(){
    try{
      localStorage.removeItem(ACCOUNTS_KEY);
      localStorage.removeItem(STATE_KEY);
      localStorage.removeItem(SESSION_KEY);
    }catch(e){ /* ignore */ }
    location.reload();
  }

  document.getElementById("auth-tab-login").addEventListener("click", function(){ authTab = "login"; authError = ""; authDraft = {}; recoverStep = "find"; recoverMatches = []; recoverMatch = null; renderAuthScreen(); });
  document.getElementById("auth-tab-register").addEventListener("click", function(){ authTab = "register"; authError = ""; authDraft = {}; recoverStep = "find"; recoverMatches = []; recoverMatch = null; renderAuthScreen(); });
  document.getElementById("logout-btn").addEventListener("click", function(){
    session = null;
    persistSession();
    authTab = "login";
    renderAll();
  });
  document.getElementById("reset-demo").addEventListener("click", resetDemo);

  (async function boot(){
    accounts = await ensureAccounts();
    notifState = loadNotifState(accounts);
    session = loadSession();
    renderAll();
  })();

  // --- Instalación como PWA (si el navegador la soporta en este origen) ---
  var deferredPrompt = null;
  var installBtn = document.getElementById("install-btn");
  window.addEventListener("beforeinstallprompt", function(ev){
    ev.preventDefault();
    deferredPrompt = ev;
    installBtn.hidden = false;
  });
  installBtn.addEventListener("click", function(){
    if (!deferredPrompt) return;
    installBtn.hidden = true;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.finally(function(){ deferredPrompt = null; });
  });
  window.addEventListener("appinstalled", function(){
    installBtn.hidden = true;
    toast("IIDE instalada");
  });

  // --- Service worker (offline / instalable) ---
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("service-worker.js").catch(function(){ /* sin SW: la app igual funciona online */ });
    });
  }
})();
</script>
</body>
</html>
